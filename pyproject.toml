[project]
name = "brackfastgw"
dynamic = ["version"]            # from the git tag (vX.Y.Z), see [tool.hatch.version]
description = "Brackfast Gateway: a local gateway between trading apps and brokers / market data sources (Alpaca, Yahoo Finance, a simulated account)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
	"msgspec>=0.19",
	"aiohttp>=3.11",
	"tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
ui = ["imgui-bundle>=1.92"]

[project.scripts]
brackfast-gateway = "brackfastgw.gateway.app:main"

[dependency-groups]
dev = [
	"pytest>=8",
	"pytest-asyncio>=0.24",
]

[tool.uv]
# reinstall the gateway (and so rewrite brackfastgw/_version.py) after a commit or a new tag
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
# the one place the version is defined: the latest git tag vX.Y.Z (git tag -a v0.2.0). Commits after it
# give X.Y.(Z+1).devN+g<commit>, uncommitted changes add .d<date>
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "brackfastgw/_version.py"     # written at install / build (not in git): brackfastgw.__version__

[tool.hatch.build.targets.wheel]
packages = ["brackfastgw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
